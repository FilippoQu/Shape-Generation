  :root {
    --bg: #ffffff;
    --ink: #000000;
    --hint: #8a8a8a;
    --ui: #e6e6e6;
    --m: 10px;
    --fs: clamp(9px, calc((100vw - 20px) / 30.2), 20px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --hint: #777777; --ui: #191919; }
  }
  :root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --hint: #777777; --ui: #191919; }
  :root[data-theme="light"] { --bg: #ffffff; --ink: #000000; --hint: #8a8a8a; --ui: #e6e6e6; }

  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    overflow: hidden;
    font-family: "ABC Diatype", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs);
    font-weight: 800;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  svg#stage { display: block; width: 100%; height: 100%; cursor: crosshair; }
  svg#stage * { fill: var(--ink); }

  .bar {
    position: fixed;
    left: var(--m); right: var(--m);
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
    mix-blend-mode: difference;
    color: #ffffff;
  }
  .bar button {
    position: absolute; top: calc(10px - 0.15em); left: 0;
    pointer-events: auto;
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; padding: 0;
    font: inherit;
    color: inherit; line-height: 1;
    cursor: pointer; white-space: pre;
    -webkit-tap-highlight-color: transparent;
  }
  .bar button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  /* formato verticale (mobile): pulsanti in basso, cursori rialzati */
  :root[data-layout="mobile"] { --fs: clamp(9px, calc((100vw - 20px) / 22.67), 20px); }
  :root[data-layout="mobile"] .bar button.top { top: 10px; }
  :root[data-layout="mobile"] .bar button.bot { top: auto; bottom: calc(15px - 0.15em); }
  :root[data-layout="mobile"] .track.v { left: 16px; top: calc(62.5px + 0.075 * var(--fs)); bottom: calc(77.5px - 0.075 * var(--fs)); }
  :root[data-layout="mobile"] .track.h { left: 27.5px; right: 27.5px; bottom: calc(66px - 0.075 * var(--fs)); }

  #ui {
    position: fixed;
    left: 0; right: 0;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  .track { position: absolute; background: var(--ui); border-radius: 1.5px; }
  .track.v { left: 28.5px; top: 40px; bottom: 40px; width: 3px; }
  .track.h { bottom: 28.5px; left: 40px; right: 40px; height: 3px; }
  .handle {
    position: absolute;
    width: 15px; height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 50%;
    background: var(--ui);
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  .handle::before { content: ""; position: absolute; inset: -15px; border-radius: 50%; }
  .handle.drag { cursor: grabbing; }
  .handle:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  #hint {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: var(--ui);
    font-size: var(--fs); line-height: 1; white-space: nowrap;
    pointer-events: none; transition: opacity .4s ease;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="ui">
  <div class="track v"></div>
  <div class="track h"></div>
  <div class="handle" id="h-v" role="slider" tabindex="0" aria-label="Centro verticale" aria-orientation="vertical"></div>
  <div class="handle" id="h-h" role="slider" tabindex="0" aria-label="Centro orizzontale" aria-orientation="horizontal"></div>
  <div id="hint">[click anywhere]</div>
</div>

<div class="bar" id="bar">
  <button id="btn-invert" class="top" type="button">● Invert color</button>
  <button id="btn-shape" class="bot" type="button">― Invert shape</button>
  <button id="btn-reset" class="bot" type="button">■ Reset</button>
  <button id="btn-random" class="bot" type="button">◆ Random</button>
  <button id="btn-save" class="top" type="button">▼ Save SVG</button>
</div>

<script>
(function () {
  var BASE = 200, MOBILE_BASE = 400, SIZE = BASE, HALF = BASE / 2;
  var isMobile = false; // formato verticale
  var NS = "http://www.w3.org/2000/svg";
  var root = document.documentElement;
  var svg = document.getElementById("stage");
  var hint = document.getElementById("hint");
  var ui = document.getElementById("ui");
  var hV = document.getElementById("h-v");
  var hH = document.getElementById("h-h");
  var TRACK_END = 40; // distanza degli estremi dei cursori dal bordo
  var fx = 0.5, fy = 0.5; // posizione del centro come frazione della pagina
  var btnInvert = document.getElementById("btn-invert");
  var btnShape = document.getElementById("btn-shape");
  var btnRandom = document.getElementById("btn-random");
  var btnReset = document.getElementById("btn-reset");
  var btnSave = document.getElementById("btn-save");
  var squares = [];
  var shapeMode = "square"; // "square" | "circle" | "triangle"
  var darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : darkMQ.matches;
  }
  function pageSize() {
    var r = svg.getBoundingClientRect();
    // desktop: 200px fisso; in formato verticale (mobile) i 400px si riducono in proporzione alla larghezza (400px a 1080px)
    SIZE = r.width < r.height ? MOBILE_BASE * Math.min(1, r.width / 1080) : BASE;
    HALF = SIZE / 2;
    isMobile = r.width < r.height;
    root.setAttribute("data-layout", isMobile ? "mobile" : "desktop");
    return { w: r.width, h: r.height };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Mobile: il blocco (cursori + scritta) sta centrato tra la riga di pulsanti in alto e quella in basso,
  // alla stessa distanza da entrambe. Dipende dalla dimensione del testo.
  function mobileBlock(h) {
    var fs = parseFloat(getComputedStyle(bar).fontSize) || 20;
    var y0 = 62.5 + 0.075 * fs;       // inizio della linea verticale
    var y1 = h - 77.5 + 0.075 * fs;   // fine della linea verticale
    return { y0: y0, y1: y1, yh: y1 + 10 }; // yh = linea orizzontale
  }

  // corsa dei cursori: in verticale (mobile) la linea verticale va da 10px a h-70px
  function trackRange(w, h) {
    return isMobile
      ? { x0: 27.5, x1: w - 27.5, y0: mobileBlock(h).y0, y1: mobileBlock(h).y1 }
      : { x0: TRACK_END, x1: w - TRACK_END, y0: TRACK_END, y1: h - TRACK_END };
  }
  function centerPoint(w, h) {
    var t = trackRange(w, h);
    return {
      x: t.x1 > t.x0 ? t.x0 + fx * (t.x1 - t.x0) : w / 2,
      y: t.y1 > t.y0 ? t.y0 + fy * (t.y1 - t.y0) : h / 2
    };
  }
  function setX(px, w, h) { var t = trackRange(w, h); fx = clamp((px - t.x0) / (t.x1 - t.x0), 0, 1); }
  function setY(py, w, h) { var t = trackRange(w, h); fy = clamp((py - t.y0) / (t.y1 - t.y0), 0, 1); }

  // rotazione casuale del triangolo: 1, 2 o 3 quarti di giro (90, 180, 270 gradi)
  function randRot() { return 1 + Math.floor(Math.random() * 3); }

  function pointInTri(px, py, t) {
    function s(ax, ay, bx, by) { return (px - bx) * (ay - by) - (ax - bx) * (py - by); }
    var d1 = s(t[0], t[1], t[2], t[3]), d2 = s(t[2], t[3], t[4], t[5]), d3 = s(t[4], t[5], t[0], t[1]);
    var neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    return !(neg && pos);
  }

  // Geometria di una forma: quadrato + triangolo con una punta al centro pagina
  function shapeFor(s, w, h, final) {
    var k = (final || s.k == null) ? 1 : s.k; // avanzamento dell'animazione, da 0 a 1
    var H = HALF * k;                          // mezza dimensione corrente (scala 0-100%)
    var c = centerPoint(w, h);
    var cx = c.x, cy = c.y;
    // posizione finale (dentro la pagina) e posizione lungo il percorso dal punto di convergenza
    var xf = w >= SIZE ? clamp(s.x, HALF, w - HALF) : s.x;
    var yf = h >= SIZE ? clamp(s.y, HALF, h - HALF) : s.y;
    var x = cx + (xf - cx) * k, y = cy + (yf - cy) * k;
    var left = x - H, top = y - H;
    var dx = cx - x, dy = cy - y;
    // diagonale piu perpendicolare alla direzione verso il centro
    var pts = null, tri = null;
    if (shapeMode === "circle") {
      // lati tangenti al cerchio: toccano la circonferenza nei punti piu esterni
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > H) {
        var phi = Math.atan2(y - cy, x - cx); // dal centro pagina verso il cerchio
        var alpha = Math.asin(H / d);
        var tl = Math.sqrt(d * d - H * H); // lunghezza del segmento tangente
        pts = [cx, cy,
               cx + tl * Math.cos(phi - alpha), cy + tl * Math.sin(phi - alpha),
               cx + tl * Math.cos(phi + alpha), cy + tl * Math.sin(phi + alpha)];
      }
    } else if (shapeMode === "triangle") {
      // base 200 e altezza 200, ruotato di 90/180/270 gradi (a caso per ogni clic) attorno al centro;
      // le linee toccano i due vertici piu esterni
      var tv = [[-H, H], [H, H], [0, -H]];
      tri = [];
      for (var m = 0; m < 3; m++) {
        var vx = tv[m][0], vy = tv[m][1];
        for (var q = 0; q < (s.rot || 0); q++) { var tmpv = vx; vx = -vy; vy = tmpv; } // 90 gradi in senso orario
        tri.push(x + vx, y + vy);
      }
      if (!pointInTri(cx, cy, tri)) {
        var best = -1, bi = 0, bj = 1;
        for (var i = 0; i < 3; i++) {
          for (var j = i + 1; j < 3; j++) {
            var ax = tri[2 * i] - cx, ay = tri[2 * i + 1] - cy;
            var bx = tri[2 * j] - cx, by = tri[2 * j + 1] - cy;
            var ang = Math.abs(Math.atan2(ax * by - ay * bx, ax * bx + ay * by));
            if (ang > best) { best = ang; bi = i; bj = j; }
          }
        }
        pts = [cx, cy, tri[2 * bi], tri[2 * bi + 1], tri[2 * bj], tri[2 * bj + 1]];
      }
    } else {
      var p1, p2;
      if (Math.abs(dx + dy) < Math.abs(dx - dy)) { p1 = [x - H, y - H]; p2 = [x + H, y + H]; }
      else                                       { p1 = [x - H, y + H]; p2 = [x + H, y - H]; }
      pts = [cx, cy, p1[0], p1[1], p2[0], p2[1]];
    }
    return {
      x: x, y: y, half: H, tri: tri,
      rect: { x: left, y: top, width: 2 * H, height: 2 * H },
      points: pts
    };
  }
  function n(v) { return Math.round(v * 100) / 100; }

  // Triangolo + linee in un solo tracciato: i bordi in comune non lasciano righe chiare.
  // Le due parti hanno sempre lo stesso verso, cosi si sommano invece di sottrarsi.
  function triPath(sh, rnd) {
    var f = rnd ? n : function (v) { return v; };
    function sub(pts) {
      var m = pts.length / 2, v = [], a = 0, k;
      for (k = 0; k < m; k++) v.push([pts[2 * k], pts[2 * k + 1]]);
      for (k = 0; k < m; k++) { var q = v[(k + 1) % m]; a += v[k][0] * q[1] - q[0] * v[k][1]; }
      if (a < 0) v.reverse();
      return "M" + v.map(function (p) { return f(p[0]) + " " + f(p[1]); }).join("L") + "Z";
    }
    return (sh.points ? sub(sh.points) : "") + sub(sh.tri);
  }

  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function render() {
    var p = pageSize();
    svg.setAttribute("viewBox", "0 0 " + p.w + " " + p.h);
    var c = centerPoint(p.w, p.h);
    hV.style.left = (isMobile ? 17.5 : 30) + "px";
    hV.style.top = c.y + "px";
    hH.style.left = c.x + "px";
    hH.style.top = (isMobile ? mobileBlock(p.h).yh : p.h - 30) + "px";
    hV.setAttribute("aria-valuenow", Math.round(c.y));
    hH.setAttribute("aria-valuenow", Math.round(c.x));
    hint.style.left = c.x + "px";
    hint.style.top = c.y + "px";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    squares.forEach(function (s) {
      var sh = shapeFor(s, p.w, p.h);
      if (sh.points && !sh.tri) svg.appendChild(el("polygon", { points: sh.points.join(" ") }));
      if (shapeMode === "circle") svg.appendChild(el("circle", { cx: sh.x, cy: sh.y, r: sh.half }));
      else if (sh.tri) svg.appendChild(el("path", { d: triPath(sh) }));
      else svg.appendChild(el("rect", sh.rect));
    });
  }

  function buildSVG() {
    var p = pageSize();
    var dark = isDark();
    var ink = dark ? "#fff" : "#000";
    var out = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n(p.w) + ' ' + n(p.h) + '">\n';
    if (dark) out += '  <rect width="' + n(p.w) + '" height="' + n(p.h) + '" fill="#000"/>\n';
    squares.forEach(function (s) {
      var sh = shapeFor(s, p.w, p.h, true); // il file salvato contiene sempre le forme finali
      var pts = sh.points ? sh.points.map(n) : null;
      if (shapeMode === "circle") {
        out += '  <circle cx="' + n(sh.x) + '" cy="' + n(sh.y) + '" r="' + n(HALF) + '" fill="' + ink + '"/>\n';
      } else if (sh.tri) {
        out += '  <path d="' + triPath(sh, true) + '" fill="' + ink + '"/>\n';
      } else {
        out += '  <rect x="' + n(sh.rect.x) + '" y="' + n(sh.rect.y) + '" width="' + n(SIZE) + '" height="' + n(SIZE) + '" fill="' + ink + '"/>\n';
      }
      if (pts && !sh.tri) out += '  <polygon points="' + pts[0] + ' ' + pts[1] + ' ' + pts[2] + ' ' + pts[3] + ' ' + pts[4] + ' ' + pts[5] + '" fill="' + ink + '"/>\n';
    });
    return out + '</svg>\n';
  }

  // Animazione di ingresso: la forma parte dal punto di convergenza, scala da 0 a 100%
  // e arriva al punto del clic: mezzo secondo con Random, un quarto di secondo con il clic singolo.
  var DURATION = 500; // ms, forme di Random
  var CLICK_DURATION = 250; // ms, forma creata con un clic
  var FRAME = 1000 / 24; // un frame a 24 fps, usato per sfalsare le forme di Random
  // Curva con influenza dell'85% in entrata e in uscita = cubic-bezier(0.85, 0, 0.15, 1)
  function ease(p) {
    var x1 = 0.85, y1 = 0, x2 = 0.15, y2 = 1;
    var lo = 0, hi = 1, tt = p, i;
    for (i = 0; i < 30; i++) {
      tt = (lo + hi) / 2;
      var bx = 3 * (1 - tt) * (1 - tt) * tt * x1 + 3 * (1 - tt) * tt * tt * x2 + tt * tt * tt;
      if (bx < p) lo = tt; else hi = tt;
    }
    return 3 * (1 - tt) * (1 - tt) * tt * y1 + 3 * (1 - tt) * tt * tt * y2 + tt * tt * tt;
  }
  var raf = 0;
  function tick(now) {
    var active = false;
    squares.forEach(function (s) {
      if (s.born == null) return;
      var pr = (now - s.born) / (s.dur || DURATION);
      if (pr >= 1) { s.k = 1; s.born = null; }
      else { s.k = ease(Math.max(0, pr)); active = true; }
    });
    render();
    raf = active ? requestAnimationFrame(tick) : 0;
  }
  function addShape(x, y, delay, dur) {
    squares.push({ x: x, y: y, rot: randRot(), k: 0, dur: dur || DURATION, born: performance.now() + (delay || 0) });
  }
  function startAnim() { if (!raf) raf = requestAnimationFrame(tick); }

  svg.addEventListener("click", function (e) {
    var r = svg.getBoundingClientRect();
    addShape(e.clientX - r.left, e.clientY - r.top, 0, CLICK_DURATION);
    hint.classList.add("hidden");
    render();
    startAnim();
  });

  btnInvert.addEventListener("click", function () {
    root.setAttribute("data-theme", isDark() ? "light" : "dark");
  });

  function bindHandle(handle, axis) {
    var dragging = false, moved = false, sx = 0, sy = 0, lastTap = 0;
    function move(e) {
      var r = ui.getBoundingClientRect();
      if (axis === "x") setX(e.clientX - r.left, r.width, r.height);
      else setY(e.clientY - r.top, r.width, r.height);
      render();
    }
    handle.addEventListener("pointerdown", function (e) {
      dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
      handle.classList.add("drag");
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 4) return;
      moved = true;
      move(e);
    });
    function end(e) {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove("drag");
      try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
      if (moved || e.type !== "pointerup") { lastTap = 0; return; }
      // doppio clic / doppio tap: il pallino torna al centro
      var now = Date.now();
      if (now - lastTap < 350) {
        lastTap = 0;
        if (axis === "x") fx = 0.5; else fy = 0.5;
        render();
      } else {
        lastTap = now;
      }
    }
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    handle.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 50 : 10, p = pageSize(), c = centerPoint(p.w, p.h);
      var k = e.key, used = true;
      if (axis === "x") {
        if (k === "ArrowLeft") setX(c.x - step, p.w, p.h);
        else if (k === "ArrowRight") setX(c.x + step, p.w, p.h);
        else used = false;
      } else {
        if (k === "ArrowUp") setY(c.y - step, p.w, p.h);
        else if (k === "ArrowDown") setY(c.y + step, p.w, p.h);
        else used = false;
      }
      if (used) { e.preventDefault(); render(); }
    });
  }
  bindHandle(hH, "x");
  bindHandle(hV, "y");

  btnRandom.addEventListener("click", function () {
    var p = pageSize();
    function rnd(len) { return len > SIZE ? HALF + Math.random() * (len - SIZE) : len / 2; }
    var count = 2 + Math.floor(Math.random() * 9); // da 2 a 10
    squares = []; // ogni Random riparte da zero
    // ingresso sfalsato: ordine casuale, ogni forma parte un frame dopo la precedente
    var order = [], i, j2, tmp;
    for (i = 0; i < count; i++) order.push(i);
    for (i = count - 1; i > 0; i--) {
      j2 = Math.floor(Math.random() * (i + 1));
      tmp = order[i]; order[i] = order[j2]; order[j2] = tmp;
    }
    for (i = 0; i < count; i++) addShape(rnd(p.w), rnd(p.h), order[i] * FRAME);
    // anche i pallini dei due assi vanno in posizione casuale
    fx = Math.random();
    fy = Math.random();
    hint.classList.add("hidden");
    render();
    startAnim();
  });

  btnShape.addEventListener("click", function () {
    var order = ["square", "circle", "triangle"];
    shapeMode = order[(order.indexOf(shapeMode) + 1) % order.length];
    render();
  });

  btnReset.addEventListener("click", function () {
    squares = [];
    fx = 0.5; fy = 0.5;
    hint.classList.remove("hidden");
    render();
  });

  var downloads = null, downloadsState = "none"; // none | pending | ready | absent
  if (window.claude && window.claude.use) {
    downloadsState = "pending";
    window.claude.use("downloads").then(function (d) {
      downloads = d;
      downloadsState = d ? "ready" : "absent";
    }).catch(function () { downloadsState = "absent"; });
  }

  btnSave.addEventListener("click", function () {
    var svgText = buildSVG();
    var tries = 0;
    (function go() {
      if (downloads) {
        downloads.save({ filename: "forme.svg", data: svgText }).catch(function () {});
        return;
      }
      if (downloadsState === "pending" && tries++ < 15) { setTimeout(go, 100); return; }
      localDownload(svgText);
    })();
  });

  function localDownload(svgText) {
    // fuori da claude.ai (file scaricato): download diretto
    try {
      var blob = new Blob([svgText], { type: "image/svg+xml" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "forme.svg";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    } catch (err) {}
  }

  // Pulsanti in alto: centri equidistanti, primo e ultimo a filo dei margini.
  // Se non c'e abbastanza spazio, passa a spazi uguali tra i pulsanti.
  var barBtns = [btnInvert, btnShape, btnReset, btnRandom, btnSave];
  var bar = document.getElementById("bar");
  function layoutBar() {
    var W = bar.clientWidth;
    if (isMobile) {
      // in alto: Invert color a sinistra, Save SVG a destra
      btnInvert.style.left = "0px";
      btnSave.style.left = (W - btnSave.offsetWidth) + "px";
      // in basso: Invert shape a sinistra, Reset al centro della pagina, Random a destra
      btnShape.style.left = "0px";
      btnReset.style.left = ((W - btnReset.offsetWidth) / 2) + "px";
      btnRandom.style.left = (W - btnRandom.offsetWidth) + "px";
      return;
    }
    var fs = parseFloat(getComputedStyle(bar).fontSize) || 20;
    var ws = barBtns.map(function (b) { return b.offsetWidth; });
    var cnt = barBtns.length, sum = 0, i;
    for (i = 0; i < cnt; i++) sum += ws[i];
    var c0 = ws[0] / 2, c1 = W - ws[cnt - 1] / 2, step = (c1 - c0) / (cnt - 1);
    var fits = true;
    for (i = 0; i < cnt - 1; i++) {
      if (step - (ws[i] + ws[i + 1]) / 2 < 0.4 * fs) fits = false;
    }
    var pos = 0, gap = Math.max(0, (W - sum) / (cnt - 1));
    for (i = 0; i < cnt; i++) {
      var x = fits ? c0 + step * i - ws[i] / 2 : pos;
      barBtns[i].style.left = x + "px";
      pos += ws[i] + gap;
    }
  }

  window.addEventListener("resize", function () { render(); layoutBar(); });
  render();
  layoutBar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutBar);
})();
</script>
</body>
</html>
